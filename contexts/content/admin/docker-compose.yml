name: devflix.content.admin

services:
  devflix.content.admin:
    container_name: devflix.content.admin
    hostname: content.admin.db
    image: postgres:18
    environment:
      POSTGRES_USER: devflix-content
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content-admin
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devflix.content.admin

networks:
  devflix.content.admin:
    driver: bridge
